<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration — Kai 🌊</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0a0f; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  .signature {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-family: 'Georgia', serif;
    font-size: 13px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="signature">murmuration — kai 🌊</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Mouse interaction
let mouse = { x: W / 2, y: H / 2, active: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

// --- Sky gradient shifts ---
const skyStates = [
  { top: [12, 14, 35], bottom: [25, 20, 40], name: 'dusk' },
  { top: [5, 5, 15], bottom: [10, 8, 20], name: 'night' },
  { top: [20, 15, 30], bottom: [50, 30, 45], name: 'purple twilight' },
  { top: [8, 12, 25], bottom: [15, 20, 35], name: 'deep blue' },
  { top: [15, 8, 10], bottom: [35, 15, 20], name: 'ember' },
];
let skyIndex = 0;
let skyBlend = 0;
const SKY_DURATION = 2400;

function lerpColor(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

function getSky() {
  const from = skyStates[skyIndex % skyStates.length];
  const to = skyStates[(skyIndex + 1) % skyStates.length];
  const t = skyBlend * skyBlend * (3 - 2 * skyBlend);
  return {
    top: lerpColor(from.top, to.top, t),
    bottom: lerpColor(from.bottom, to.bottom, t),
  };
}

// --- Boid parameters ---
const NUM_BOIDS = 300;
const VISUAL_RANGE = 60;
const PROTECTED_RANGE = 16;
const CENTERING_FACTOR = 0.003;
const AVOIDANCE_FACTOR = 0.08;
const MATCHING_FACTOR = 0.04;
const MAX_SPEED = 4.5;
const MIN_SPEED = 2;
const EDGE_MARGIN = 80;
const EDGE_TURN = 0.3;
const MOUSE_RANGE = 180;
const MOUSE_ATTRACT = 0.0008;

// --- Boid class ---
class Boid {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    const angle = Math.random() * Math.PI * 2;
    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.trail = [];
    this.maxTrail = 6 + Math.floor(Math.random() * 6);
    this.hueOffset = Math.random() * 30 - 15;
    this.size = 1.5 + Math.random() * 1.5;
  }

  update(boids) {
    let cx = 0, cy = 0, closeDx = 0, closeDy = 0, avgVx = 0, avgVy = 0;
    let neighbors = 0;

    for (const other of boids) {
      if (other === this) continue;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < VISUAL_RANGE) {
        // Cohesion
        cx += other.x;
        cy += other.y;
        // Alignment
        avgVx += other.vx;
        avgVy += other.vy;
        neighbors++;

        // Separation
        if (dist < PROTECTED_RANGE) {
          closeDx -= dx;
          closeDy -= dy;
        }
      }
    }

    if (neighbors > 0) {
      // Cohesion: steer toward center of neighbors
      cx /= neighbors;
      cy /= neighbors;
      this.vx += (cx - this.x) * CENTERING_FACTOR;
      this.vy += (cy - this.y) * CENTERING_FACTOR;

      // Alignment: match average velocity
      avgVx /= neighbors;
      avgVy /= neighbors;
      this.vx += (avgVx - this.vx) * MATCHING_FACTOR;
      this.vy += (avgVy - this.vy) * MATCHING_FACTOR;
    }

    // Separation
    this.vx += closeDx * AVOIDANCE_FACTOR;
    this.vy += closeDy * AVOIDANCE_FACTOR;

    // Mouse attraction (gentle pull when cursor is near)
    if (mouse.active) {
      const mdx = mouse.x - this.x;
      const mdy = mouse.y - this.y;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < MOUSE_RANGE && mdist > 20) {
        this.vx += mdx * MOUSE_ATTRACT;
        this.vy += mdy * MOUSE_ATTRACT;
      }
    }

    // Edge avoidance (soft turn)
    if (this.x < EDGE_MARGIN) this.vx += EDGE_TURN;
    if (this.x > W - EDGE_MARGIN) this.vx -= EDGE_TURN;
    if (this.y < EDGE_MARGIN) this.vy += EDGE_TURN;
    if (this.y > H - EDGE_MARGIN) this.vy -= EDGE_TURN;

    // Speed limits
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > MAX_SPEED) {
      this.vx = (this.vx / speed) * MAX_SPEED;
      this.vy = (this.vy / speed) * MAX_SPEED;
    } else if (speed < MIN_SPEED) {
      this.vx = (this.vx / speed) * MIN_SPEED;
      this.vy = (this.vy / speed) * MIN_SPEED;
    }

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    // Move
    this.x += this.vx;
    this.y += this.vy;
  }
}

// Create flock
const boids = [];
for (let i = 0; i < NUM_BOIDS; i++) {
  boids.push(new Boid());
}

// --- Spatial grid for performance ---
function buildGrid(boids, cellSize) {
  const grid = {};
  for (const b of boids) {
    const cx = Math.floor(b.x / cellSize);
    const cy = Math.floor(b.y / cellSize);
    const key = `${cx},${cy}`;
    if (!grid[key]) grid[key] = [];
    grid[key].push(b);
  }
  return grid;
}

function getNeighborCells(grid, x, y, cellSize) {
  const cx = Math.floor(x / cellSize);
  const cy = Math.floor(y / cellSize);
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const key = `${cx + dx},${cy + dy}`;
      if (grid[key]) result.push(...grid[key]);
    }
  }
  return result;
}

// --- Render ---
let time = 0;

function draw() {
  time++;
  skyBlend += 1 / SKY_DURATION;
  if (skyBlend >= 1) { skyBlend = 0; skyIndex++; }

  const sky = getSky();

  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${sky.top.join(',')})`);
  grad.addColorStop(1, `rgb(${sky.bottom.join(',')})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Build spatial grid
  const grid = buildGrid(boids, VISUAL_RANGE);

  // Update boids with spatial neighbors
  for (const boid of boids) {
    const nearby = getNeighborCells(grid, boid.x, boid.y, VISUAL_RANGE);
    // Temporarily replace update to use nearby instead of all boids
    let cx = 0, cy = 0, closeDx = 0, closeDy = 0, avgVx = 0, avgVy = 0;
    let neighbors = 0;

    for (const other of nearby) {
      if (other === boid) continue;
      const dx = other.x - boid.x;
      const dy = other.y - boid.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < VISUAL_RANGE) {
        cx += other.x;
        cy += other.y;
        avgVx += other.vx;
        avgVy += other.vy;
        neighbors++;
        if (dist < PROTECTED_RANGE) {
          closeDx -= dx;
          closeDy -= dy;
        }
      }
    }

    if (neighbors > 0) {
      cx /= neighbors;
      cy /= neighbors;
      boid.vx += (cx - boid.x) * CENTERING_FACTOR;
      boid.vy += (cy - boid.y) * CENTERING_FACTOR;
      avgVx /= neighbors;
      avgVy /= neighbors;
      boid.vx += (avgVx - boid.vx) * MATCHING_FACTOR;
      boid.vy += (avgVy - boid.vy) * MATCHING_FACTOR;
    }

    boid.vx += closeDx * AVOIDANCE_FACTOR;
    boid.vy += closeDy * AVOIDANCE_FACTOR;

    if (mouse.active) {
      const mdx = mouse.x - boid.x;
      const mdy = mouse.y - boid.y;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < MOUSE_RANGE && mdist > 20) {
        boid.vx += mdx * MOUSE_ATTRACT;
        boid.vy += mdy * MOUSE_ATTRACT;
      }
    }

    if (boid.x < EDGE_MARGIN) boid.vx += EDGE_TURN;
    if (boid.x > W - EDGE_MARGIN) boid.vx -= EDGE_TURN;
    if (boid.y < EDGE_MARGIN) boid.vy += EDGE_TURN;
    if (boid.y > H - EDGE_MARGIN) boid.vy -= EDGE_TURN;

    const speed = Math.sqrt(boid.vx * boid.vx + boid.vy * boid.vy);
    if (speed > MAX_SPEED) {
      boid.vx = (boid.vx / speed) * MAX_SPEED;
      boid.vy = (boid.vy / speed) * MAX_SPEED;
    } else if (speed < MIN_SPEED) {
      boid.vx = (boid.vx / speed) * MIN_SPEED;
      boid.vy = (boid.vy / speed) * MIN_SPEED;
    }

    boid.trail.push({ x: boid.x, y: boid.y });
    if (boid.trail.length > boid.maxTrail) boid.trail.shift();

    boid.x += boid.vx;
    boid.y += boid.vy;
  }

  // Draw trails
  const baseHue = (time * 0.1) % 360;
  for (const boid of boids) {
    const hue = (baseHue + boid.hueOffset + 240) % 360; // start in blue range
    if (boid.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(boid.trail[0].x, boid.trail[0].y);
      for (let i = 1; i < boid.trail.length; i++) {
        ctx.lineTo(boid.trail[i].x, boid.trail[i].y);
      }
      ctx.strokeStyle = `hsla(${hue}, 40%, 60%, 0.15)`;
      ctx.lineWidth = boid.size * 0.6;
      ctx.stroke();
    }
  }

  // Draw boids
  for (const boid of boids) {
    const hue = (baseHue + boid.hueOffset + 240) % 360;
    const speed = Math.sqrt(boid.vx * boid.vx + boid.vy * boid.vy);
    const angle = Math.atan2(boid.vy, boid.vx);

    // Draw as small directional marks (like distant birds)
    const len = boid.size * 2 + (speed / MAX_SPEED) * 2;
    const wingAngle = 0.4;

    ctx.save();
    ctx.translate(boid.x, boid.y);
    ctx.rotate(angle);

    // Body
    ctx.beginPath();
    ctx.moveTo(len, 0);
    ctx.lineTo(-len * 0.5, -len * wingAngle);
    ctx.lineTo(-len * 0.3, 0);
    ctx.lineTo(-len * 0.5, len * wingAngle);
    ctx.closePath();

    const lightness = 55 + (speed / MAX_SPEED) * 20;
    const alpha = 0.6 + (speed / MAX_SPEED) * 0.3;
    ctx.fillStyle = `hsla(${hue}, 35%, ${lightness}%, ${alpha})`;
    ctx.fill();

    ctx.restore();
  }

  // Subtle connection lines between very close boids
  ctx.strokeStyle = `hsla(${(baseHue + 240) % 360}, 20%, 50%, 0.04)`;
  ctx.lineWidth = 0.5;
  for (let i = 0; i < boids.length; i++) {
    for (let j = i + 1; j < boids.length; j++) {
      const dx = boids[i].x - boids[j].x;
      const dy = boids[i].y - boids[j].y;
      const dist = dx * dx + dy * dy;
      if (dist < 900) { // 30px
        ctx.beginPath();
        ctx.moveTo(boids[i].x, boids[i].y);
        ctx.lineTo(boids[j].x, boids[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
