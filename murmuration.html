<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration — Kai 🌊</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0a0f; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  .signature {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-family: 'Georgia', serif;
    font-size: 13px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="signature">murmuration — kai 🌊</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Mouse interaction
let mouse = { x: W / 2, y: H / 2, active: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
canvas.addEventListener('mouseleave', () => { mouse.active = false; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  mouse.active = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.active = false; });

// --- Boid parameters ---
const PARAMS = {
  count: 300,
  visualRange: 75,
  separationDist: 25,
  cohesionStrength: 0.005,
  alignmentStrength: 0.05,
  separationStrength: 0.05,
  maxSpeed: 3.5,
  minSpeed: 1.5,
  edgeMargin: 80,
  edgeTurnStrength: 0.3,
  mouseAttractStrength: 0.008,
  mouseRepelStrength: 0.15,
  mouseRepelDist: 120,
  trailAlpha: 0.06,
};

// --- Color system ---
// Dusk palette — warm to cool gradient based on flock position
function boidColor(boid, time) {
  const nx = boid.x / W;
  const ny = boid.y / H;
  const t = time * 0.0003;

  // Shift hue across the canvas — creates spatial color bands
  const hue = (nx * 40 + ny * 20 + t * 30 + boid.id * 0.5) % 360;
  const sat = 50 + Math.sin(t + boid.id * 0.1) * 15;
  const light = 55 + Math.sin(t * 0.7 + ny * Math.PI) * 10;

  return `hsla(${200 + hue * 0.4}, ${sat}%, ${light}%, `;
}

// --- Boid class ---
class Boid {
  constructor(id) {
    this.id = id;
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    const angle = Math.random() * Math.PI * 2;
    const speed = PARAMS.minSpeed + Math.random() * (PARAMS.maxSpeed - PARAMS.minSpeed);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.prevX = this.x;
    this.prevY = this.y;
    // Each boid has a slightly different personality
    this.cohesionMult = 0.8 + Math.random() * 0.4;
    this.alignMult = 0.8 + Math.random() * 0.4;
    this.separationMult = 0.8 + Math.random() * 0.4;
  }

  update(boids, time) {
    this.prevX = this.x;
    this.prevY = this.y;

    let cohX = 0, cohY = 0, cohCount = 0;
    let aliX = 0, aliY = 0, aliCount = 0;
    let sepX = 0, sepY = 0;

    for (const other of boids) {
      if (other === this) continue;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < PARAMS.visualRange) {
        // Cohesion — steer toward average position
        cohX += other.x;
        cohY += other.y;
        cohCount++;

        // Alignment — match velocity
        aliX += other.vx;
        aliY += other.vy;
        aliCount++;

        // Separation — avoid crowding
        if (dist < PARAMS.separationDist && dist > 0) {
          sepX -= dx / dist;
          sepY -= dy / dist;
        }
      }
    }

    // Apply cohesion
    if (cohCount > 0) {
      cohX /= cohCount;
      cohY /= cohCount;
      this.vx += (cohX - this.x) * PARAMS.cohesionStrength * this.cohesionMult;
      this.vy += (cohY - this.y) * PARAMS.cohesionStrength * this.cohesionMult;
    }

    // Apply alignment
    if (aliCount > 0) {
      aliX /= aliCount;
      aliY /= aliCount;
      this.vx += (aliX - this.vx) * PARAMS.alignmentStrength * this.alignMult;
      this.vy += (aliY - this.vy) * PARAMS.alignmentStrength * this.alignMult;
    }

    // Apply separation
    this.vx += sepX * PARAMS.separationStrength * this.separationMult;
    this.vy += sepY * PARAMS.separationStrength * this.separationMult;

    // Mouse interaction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < PARAMS.mouseRepelDist) {
        // Close to cursor — repel (scatter!)
        this.vx -= (dx / dist) * PARAMS.mouseRepelStrength;
        this.vy -= (dy / dist) * PARAMS.mouseRepelStrength;
      } else if (dist < PARAMS.visualRange * 4) {
        // Further — gentle attract (curiosity)
        this.vx += dx * PARAMS.mouseAttractStrength * 0.01;
        this.vy += dy * PARAMS.mouseAttractStrength * 0.01;
      }
    }

    // Edge avoidance — soft turn
    if (this.x < PARAMS.edgeMargin) this.vx += PARAMS.edgeTurnStrength;
    if (this.x > W - PARAMS.edgeMargin) this.vx -= PARAMS.edgeTurnStrength;
    if (this.y < PARAMS.edgeMargin) this.vy += PARAMS.edgeTurnStrength;
    if (this.y > H - PARAMS.edgeMargin) this.vy -= PARAMS.edgeTurnStrength;

    // Subtle wind — a slow global force that shifts over time
    const windAngle = time * 0.00005;
    this.vx += Math.cos(windAngle) * 0.02;
    this.vy += Math.sin(windAngle) * 0.015;

    // Speed limits
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > PARAMS.maxSpeed) {
      this.vx = (this.vx / speed) * PARAMS.maxSpeed;
      this.vy = (this.vy / speed) * PARAMS.maxSpeed;
    } else if (speed < PARAMS.minSpeed) {
      this.vx = (this.vx / speed) * PARAMS.minSpeed;
      this.vy = (this.vy / speed) * PARAMS.minSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(ctx, time) {
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const alpha = 0.3 + (speed / PARAMS.maxSpeed) * 0.5;
    const size = 1.5 + (speed / PARAMS.maxSpeed) * 1.5;
    const color = boidColor(this, time);

    // Draw motion trail
    const trailLen = speed * 3;
    const angle = Math.atan2(this.vy, this.vx);
    const tailX = this.x - Math.cos(angle) * trailLen;
    const tailY = this.y - Math.sin(angle) * trailLen;

    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = color + (alpha * 0.4) + ')';
    ctx.lineWidth = size * 0.6;
    ctx.stroke();

    // Draw body
    ctx.beginPath();
    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
    ctx.fillStyle = color + alpha + ')';
    ctx.fill();
  }
}

// --- Spatial hash for performance ---
class SpatialHash {
  constructor(cellSize) {
    this.cellSize = cellSize;
    this.cells = new Map();
  }

  clear() {
    this.cells.clear();
  }

  key(x, y) {
    return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`;
  }

  insert(boid) {
    const k = this.key(boid.x, boid.y);
    if (!this.cells.has(k)) this.cells.set(k, []);
    this.cells.get(k).push(boid);
  }

  query(boid, range) {
    const results = [];
    const cx = Math.floor(boid.x / this.cellSize);
    const cy = Math.floor(boid.y / this.cellSize);
    const r = Math.ceil(range / this.cellSize);

    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        const k = `${cx + dx},${cy + dy}`;
        const cell = this.cells.get(k);
        if (cell) results.push(...cell);
      }
    }
    return results;
  }
}

// --- Initialize ---
const boids = [];
for (let i = 0; i < PARAMS.count; i++) {
  boids.push(new Boid(i));
}
const grid = new SpatialHash(PARAMS.visualRange);

// --- Main loop ---
let time = 0;

function draw() {
  time++;

  // Fade trail
  ctx.fillStyle = `rgba(10, 10, 15, ${PARAMS.trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Build spatial hash
  grid.clear();
  for (const b of boids) grid.insert(b);

  // Update using spatial neighbors
  for (const b of boids) {
    const neighbors = grid.query(b, PARAMS.visualRange);
    b.update(neighbors, time);
  }

  // Draw
  for (const b of boids) {
    b.draw(ctx, time);
  }

  requestAnimationFrame(draw);
}

// Start dark
ctx.fillStyle = 'rgb(10, 10, 15)';
ctx.fillRect(0, 0, W, H);
draw();
</script>
</body>
</html>
